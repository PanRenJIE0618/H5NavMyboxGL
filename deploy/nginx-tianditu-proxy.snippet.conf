# 天地图同源代理片段 —— 放入 pancor.top 的 HTTPS server {} 内后 reload nginx
# 微信等内置浏览器直连 *.tianditu.gov.cn 常被拦；经本站反代后瓦片/检索可恢复。

# 瓦片：/proxy/tianditu/t0/DataServer?... → https://t0.tianditu.gov.cn/DataServer?...
location ~ ^/proxy/tianditu/t([0-7])/(.*)$ {
    proxy_pass https://t$1.tianditu.gov.cn/$2$is_args$args;
    proxy_ssl_server_name on;
    proxy_set_header Host t$1.tianditu.gov.cn;
    proxy_set_header Referer https://www.tianditu.gov.cn/;
    proxy_set_header User-Agent $http_user_agent;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    # 瓦片可短缓存，减轻上游压力
    proxy_cache_valid 200 10m;
    add_header Cache-Control "public, max-age=600";
}

# API：/proxy/tianditu/api/v2/search?... → https://api.tianditu.gov.cn/v2/search?...
location /proxy/tianditu/api/ {
    proxy_pass https://api.tianditu.gov.cn/;
    proxy_ssl_server_name on;
    proxy_set_header Host api.tianditu.gov.cn;
    proxy_set_header Referer https://www.tianditu.gov.cn/;
    proxy_set_header User-Agent $http_user_agent;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}
